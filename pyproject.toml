[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-ecommerce-assistant"
version = "1.0.0"
description = "LangGraph multi-agent research assistant using Ollama and PostgreSQL e-commerce data"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60,<1.1", "langchain-core>=0.3.28,<2", "langchain-ollama>=0.2.2,<1",
  "streamlit>=1.41,<2", "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2.3,<4",
  "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
